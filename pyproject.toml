[project]
name = "news-recommendation-words"
version = "1.0.0"
description = "Local LangGraph workflow for news recommendation words"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "Jinja2>=3.1,<4",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "numpy>=2.0,<3",
    "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
